<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADM — Inscriptions</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: var(--cream); }
  .admin-wrap { max-width: 1000px; margin: 0 auto; padding: 64px 24px; }
  .admin-gate {
    max-width: 380px; margin: 80px auto; background: var(--white);
    border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-md);
    border: 1px solid var(--border-light);
  }
  .admin-gate h1 { font-size: 22px; margin-bottom: 6px; }
  .admin-gate p { font-size: 14px; margin-bottom: 20px; }
  .admin-gate input {
    width: 100%; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    padding: 12px 14px; font-size: 15px; font-family: inherit; margin-bottom: 14px;
  }
  .admin-error { color: var(--error); font-size: 13.5px; font-weight: 600; min-height: 18px; margin: 0 0 10px; }
  .admin-label { font-size: 12.5px; font-weight: 700; color: var(--navy); display: block; margin-bottom: 4px; }
  table { width: 100%; border-collapse: collapse; background: var(--white); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  th, td { text-align: left; padding: 12px 14px; font-size: 14px; border-bottom: 1px solid var(--border-light); }
  th { background: var(--navy); color: #fff; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .3px; }
  tr:last-child td { border-bottom: none; }
  .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .admin-count { font-size: 14px; color: var(--text-secondary); }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
  [hidden] { display: none !important; }
  @media (max-width: 700px) {
    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    tr { background: var(--white); border-radius: var(--radius-sm); margin-bottom: 12px; box-shadow: var(--shadow-sm); padding: 8px 0; }
    td { border: none; padding: 6px 14px; }
    td::before { content: attr(data-label); display: block; font-size: 11px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; }
  }
</style>
</head>
<body>

<div id="gate" class="admin-gate">
  <h1>ADM — Inscriptions</h1>
  <p>Accès réservé aux administrateurs ADM.</p>

  <label class="admin-label" for="gateEmail">Email</label>
  <input type="email" id="gateEmail" placeholder="vous@exemple.com" autocomplete="username">

  <label class="admin-label" for="gatePwd">Mot de passe</label>
  <input type="password" id="gatePwd" placeholder="Mot de passe" autocomplete="current-password">

  <p class="admin-error" id="gateError"></p>
  <button type="button" class="btn btn-primary btn-block" id="gateSubmit">Voir les inscriptions</button>
</div>

<div id="content" class="admin-wrap" hidden>
  <div class="admin-header">
    <div>
      <h1 style="margin-bottom:2px;">Inscriptions ADM</h1>
      <span class="admin-count" id="count"></span>
    </div>
    <button type="button" class="btn btn-outline btn-sm" id="refreshBtn">Actualiser</button>
  </div>
  <div id="tableWrap"></div>
</div>

<script>
(function () {
  'use strict';

  var gate = document.getElementById('gate');
  var content = document.getElementById('content');
  var emailInput = document.getElementById('gateEmail');
  var pwdInput = document.getElementById('gatePwd');
  var gateError = document.getElementById('gateError');
  var gateSubmit = document.getElementById('gateSubmit');
  var tableWrap = document.getElementById('tableWrap');
  var countEl = document.getElementById('count');
  var refreshBtn = document.getElementById('refreshBtn');

  function getStoredCredentials() {
    var raw = sessionStorage.getItem('adm_admin_creds');
    return raw ? JSON.parse(raw) : null;
  }

  function storeCredentials(email, password) {
    sessionStorage.setItem('adm_admin_creds', JSON.stringify({ email: email, password: password }));
  }

  function fetchLeads(email, password) {
    gateError.textContent = '';
    return fetch('/api/leads', {
      headers: { 'x-admin-email': email, 'x-admin-password': password }
    })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (result) {
        if (!result.ok) {
          throw new Error(result.data && result.data.message ? result.data.message : 'Erreur');
        }
        return result.data.leads || [];
      });
  }

  function renderLeads(leads) {
    countEl.textContent = leads.length + ' inscription' + (leads.length > 1 ? 's' : '');

    if (!leads.length) {
      tableWrap.innerHTML = '<div class="empty-state">Aucune inscription pour le moment.</div>';
      return;
    }

    var rows = leads.map(function (lead) {
      var d = lead.date ? new Date(lead.date) : null;
      var dateStr = d ? d.toLocaleString('fr-FR') : '—';
      return (
        '<tr>' +
        '<td data-label="Date">' + dateStr + '</td>' +
        '<td data-label="Nom / Entreprise">' + escapeHtml(lead.name) + '</td>' +
        '<td data-label="Téléphone">' + escapeHtml(lead.phone) + '</td>' +
        '<td data-label="Email">' + escapeHtml(lead.email) + '</td>' +
        '<td data-label="Domaine">' + escapeHtml(lead.domaine) + '</td>' +
        '</tr>'
      );
    }).join('');

    tableWrap.innerHTML =
      '<table><thead><tr><th>Date</th><th>Nom / Entreprise</th><th>Téléphone</th><th>Email</th><th>Domaine</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>';
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function unlock(email, password) {
    gateError.textContent = '';
    return fetchLeads(email, password)
      .then(function (leads) {
        storeCredentials(email, password);
        gate.hidden = true;
        content.hidden = false;
        renderLeads(leads);
      })
      .catch(function (err) {
        gateError.textContent = err.message || 'Email ou mot de passe incorrect.';
      });
  }

  function handleSubmit() {
    var email = emailInput.value.trim();
    var password = pwdInput.value;
    gateError.textContent = '';

    if (!email || !password) {
      gateError.textContent = 'Merci de renseigner l\'email et le mot de passe.';
      return;
    }

    unlock(email, password);
  }

  gateSubmit.addEventListener('click', handleSubmit);
  pwdInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') handleSubmit(); });

  refreshBtn.addEventListener('click', function () {
    var creds = getStoredCredentials();
    if (!creds) return;
    fetchLeads(creds.email, creds.password).then(renderLeads).catch(function (err) {
      alert(err.message || 'Erreur lors de l\'actualisation.');
    });
  });

  var stored = getStoredCredentials();
  if (stored) { unlock(stored.email, stored.password); }
})();
</script>

</body>
</html>
